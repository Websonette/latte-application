name: websonette-latte-application

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /workspace/examples/dev-app
    command: ["sh", "-c", "chown -R www-data:www-data /workspace/examples/dev-app/log /workspace/examples/dev-app/temp && php-fpm"]
    environment:
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Prague}
      COMPOSER_ROOT_VERSION: dev-main
    volumes:
      - .:/workspace
      - dev-app-log:/workspace/examples/dev-app/log
      - dev-app-temp:/workspace/examples/dev-app/temp

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/workspace:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  dev-app-log:
  dev-app-temp:
